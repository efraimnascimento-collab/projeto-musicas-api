<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Music System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎧 Cadastro de Músicas</h1>

<form id="form">
  <input id="nome" placeholder="Nome da música">
  <input id="artista" placeholder="Artista">

  <select id="categoria">
    <option>Pop</option>
    <option>MPB</option>
    <option>Funk</option>
    <option>Trap</option>
  </select>

  <input id="imagem" placeholder="URL da imagem">

  <button type="submit">Adicionar</button>
</form>

<ul id="lista"></ul>

<footer>
  Equipe: Efraim, Grazielle, Júlia Abreu, Maria Luiza e Nicolle
</footer>

<script src="script.js"></script>
</body>
</html>
